version: 2.1

jobs:
  build-and-lint:
    docker:
      - image: cimg/node:22.14
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package-lock.json" }}
            - v1-deps-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: v1-deps-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - run:
          name: Build core
          command: npm run build
      - run:
          name: Lint core
          command: npm run lint

workflows:
  version: 2
  build:
    jobs:
      - build-and-lint