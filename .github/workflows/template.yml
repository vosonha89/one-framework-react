name: template

on:
  push:
    branches: [main]
    paths:
      - "one-react-template/**"
      - ".github/workflows/template.yml"
  pull_request:
    paths:
      - "one-react-template/**"
      - ".github/workflows/template.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: one-react-template

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          # No lockfile is committed for the template, so no npm cache here.

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        # If the npm sandbox blocks install scripts (esbuild, @parcel/watcher),
        # uncomment the approve step below — see template README §3.
        # - run: npm install-scripts approve esbuild @parcel/watcher

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build:prod

  # Proves that plop-generated code complies with the strict quality gate.
  # Uses distinct names so no generator overwrites another's output.
  generator-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        # If the npm sandbox blocks install scripts (esbuild, @parcel/watcher),
        # uncomment the approve step below — see template README §3.
        # - run: npm install-scripts approve esbuild @parcel/watcher

      - name: Scaffold a generated feature
        run: |
          npx plop view -- --name Demo
          npx plop service -- --name Demo
          npx plop model -- --name Widget

      - name: Lint generated code
        run: npm run lint

      - name: Typecheck generated code
        run: npm run typecheck

