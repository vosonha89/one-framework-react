name: core

on:
  push:
    branches: [main]
    paths:
      - "one-frontend-core/**"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "one-frontend-core/**"
      - ".github/workflows/core.yml"

defaults:
  run:
    working-directory: one-frontend-core

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: one-frontend-core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build

      - name: Lint core
        run: npm run lint

      - name: Typecheck core
        run: npm run typecheck

      - name: Unit tests
        run: npm run test
