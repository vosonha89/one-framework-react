name: core

on:
  push:
    branches: [main]
    paths:
      - "one-frontend-core/**"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "one-frontend-core/**"
      - ".github/workflows/core.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: one-frontend-core

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: one-frontend-core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build

      - name: Lint core
        run: npm run lint

      - name: Typecheck core
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

